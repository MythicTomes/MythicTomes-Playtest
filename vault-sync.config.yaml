# Configuration for scripts/sync-from-vault.mjs.
#
# TheBigVaultOfDnD is the single source of truth. A vault note is published when its
# frontmatter contains `publish: true`. Everything below derives the public metadata and
# output path so that vault notes only need to state what cannot be derived.

# Vault checkout to read from. Override with --vault <path> or VAULT_DIR.
vault: ../TheBigVaultOfDnD

# Author used when a note does not set `author`. Authors listed in `managedAuthors` have
# their folders under content/authors/ owned by this script: hand-added or hand-edited
# files there fail `npm run sync:check`.
defaultAuthor: Ekenwars
managedAuthors:
  - Ekenwars

lockFile: vault-sync.lock.json

# Vault folders are never scanned.
ignoreFolders:
  - .git
  - .obsidian
  - .trash
  - Archive
  - Session Transcriptions
  - MythicTomes Intelligence

# First matching rule (by vault-relative path) supplies category and, optionally,
# subcategory. A named group `subcategory` in the pattern is used as the subcategory.
# Frontmatter `category` / `subcategory` always win.
categoryRules:
  - pattern: "Catalogue\\.md$"
    category: Catalogue
  - pattern: "^Homebrew Vault/Races/"
    category: Species
    subcategory: Legacy Species
  - pattern: "^Homebrew Vault/Subclasses/(?<subcategory>[^/]+)/"
    category: Subclass
  - pattern: "/Rules and Mechanics/"
    category: Rules and Mechanics
  - pattern: "/Magic Items/"
    category: Magic Item

# Output path under content/, by category. Placeholders: {author}, {subcategory},
# {file} (vault basename) and {title}.
outputPaths:
  Catalogue: catalogues/{title}.md
  Species: authors/{author}/Species/{file}
  Subclass: authors/{author}/Subclasses/{subcategory}/{file}
  Rules and Mechanics: authors/{author}/Rules and Mechanics/{file}
  Magic Item: authors/{author}/Magic Items/{file}

# Headings and order used for the generated works list in each managed author's index.md.
authorIndex:
  - category: Magic Item
    heading: Magic Items
    label: magic items
    groupBySubcategory: true
    lowercaseSubcategory: true
  - category: Rules and Mechanics
    heading: Rules and Mechanics
    label: rules and mechanics
    groupBySubcategory: true
    lowercaseSubcategory: [General]
  - category: Species
    heading: Species
    label: species
    groupBySubcategory: false
  - category: Subclass
    heading: Subclasses
    label: subclasses
    groupBySubcategory: true

# Per-catalogue tag added to every member, and the folder (under content/) that receives
# images embedded by members. Notes outside any catalogue use assets/<author slug>/.
catalogues:
  Hongshan Playtest:
    tag: hongshan
    assets: assets/ekenwars/hongshan
  Everfrost:
    tag: everfrost
    assets: assets/ekenwars/everfrost
