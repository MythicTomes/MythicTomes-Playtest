# Configuration for scripts/sync-from-vault.mjs.
#
# TheBigVaultOfDnD is the single source of truth. A vault note is published when its
# frontmatter contains `publish: true`. Everything below derives the public metadata and
# output path so that vault notes only need to state what cannot be derived.
#
# Published layout: content/catalogues/<catalogue folder>/<category>/[<subcategory>/]<note>.md
# The sidebar is that directory tree, so a new vault folder becomes a new section on the next
# sync with no configuration. Moving a note redirects its old URL (see `aliases` in the lock).

# Vault checkout to read from. Override with --vault <path> or VAULT_DIR.
vault: ../TheBigVaultOfDnD

# Author recorded in each page's metadata when a note does not set `author`. Pages are no
# longer grouped by author, but the property is kept so that grouping can return.
defaultAuthor: Ekenwars

lockFile: vault-sync.lock.json

# Vault folders are never scanned.
ignoreFolders:
  - .git
  - .obsidian
  - .trash
  - Archive
  - Session Transcriptions
  - MythicTomes Intelligence

# Vault folders that each hold one setting: vault root folder -> catalogue name (a key of
# `catalogues` below). Every note inside belongs to that catalogue; the folder directly below
# the root is its category and a second folder is its subcategory. A `catalogues`, `category`
# or `subcategory` property in a note always wins over its folder.
settings:
  Hongshan: Hongshan Playtest
  Everfrost - Frostpunk Setting: Everfrost

# Fallback for notes outside a setting folder. First matching rule (by vault-relative path)
# supplies category and, optionally, subcategory. A named group `subcategory` in the pattern
# is used as the subcategory. Folder-derived values and frontmatter win over these.
categoryRules:
  - pattern: "Catalogue\\.md$"
    category: Catalogue
  - pattern: "^Homebrew Vault/Races/"
    category: Species
    subcategory: Legacy Species
  - pattern: "^Homebrew Vault/Subclasses/(?<subcategory>[^/]+)/"
    category: Subclass
  - pattern: "/Rules and Mechanics/"
    category: Rules and Mechanics
  - pattern: "/Magic Items/"
    category: Magic Item

# Site folder name for a category when it differs from the category itself.
categoryFolders:
  Subclass: Subclasses
  Magic Item: Magic Items

# Categories whose subcategory is metadata only and does not add a folder.
flatCategories:
  - Species

# Per catalogue: the tag added to every member, the site folder under content/catalogues/,
# and the folder (under content/) that receives images embedded by members.
catalogues:
  Hongshan Playtest:
    tag: hongshan
    folder: Hongshan
    assets: assets/ekenwars/hongshan
  Everfrost:
    tag: everfrost
    folder: Everfrost
    assets: assets/ekenwars/everfrost

# Presentation overrides for generated catalogue navigation.
catalogueNavigation:
  Hongshan Playtest:
    label: Hongshan - Legend of the Red Mountain
    description: A Chinese, Wuxia-inspired setting.
  Everfrost Catalogue:
    label: Everfrost
    description: A collection of Everfrost setting material.
