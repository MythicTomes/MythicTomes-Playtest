# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: MythicTomes
  pageTitleSuffix: " | 5E-Compatible Homebrew"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: example.invalid
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Spectral
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fffdf7"
        lightgray: "#e8e0cf"
        gray: "#aa9d86"
        darkgray: "#51483b"
        dark: "#211b15"
        secondary: "#7b2d26"
        tertiary: "#9a6935"
        highlight: "rgba(154, 105, 53, 0.16)"
        textHighlight: "#ead39a88"
      darkMode:
        light: "#181512"
        lightgray: "#332d27"
        gray: "#71685d"
        darkgray: "#d9d0c3"
        dark: "#f5eee2"
        secondary: "#e29a82"
        tertiary: "#d2aa6d"
        highlight: "rgba(210, 170, 109, 0.18)"
        textHighlight: "#8d672f88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/backlinks"
    enabled: true
    options:
      hideWhenEmpty: true
    layout:
      position: right
      priority: 40
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
    options:
      showFolderCount: false
      showSubfolders: false
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      folderDefaultState: collapsed
      folderClickBehavior: link
      useSavedState: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Source: https://github.com/MythicTomes/MythicTomes-Playtest
        Licensing: /licensing
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      collapsed: true
      includedProperties:
        - author
        - category
        - subcategory
        - catalogues
        - tags
        - version
        - licence
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
